name: Build

on:
  push:
    branches:
      - kkutuio
    tags-ignore:
      - 'kkutu-web-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: "Build - SpringBoot & Frontend"
    runs-on: ubuntu-latest

    steps:
      - name: "[Git] Checkout repository"
        uses: actions/checkout@v6

      - name: "Use pnpm"
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: "Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "[Frontend] Verify and build with Vite"
        run: pnpm verify

      - name: "[WAS] Set up JDK 25"
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: "[WAS] Set up Gradle and validate wrapper"
        uses: gradle/actions/setup-gradle@v6

      - name: "[WAS] Make gradlew executable"
        run: chmod +x ./gradlew

      - name: "[WAS] Build with Gradle"
        run: ./gradlew bootJar

      - name: "[Artifact] Upload"
        uses: actions/upload-artifact@v7
        with:
          name: kkutu-web
          path: build/libs/kkutu-web-*.jar
  docker:
    name: "Publish - GitHub Packages"
    runs-on: ubuntu-latest
    needs: [ build ]

    permissions:
      contents: read
      packages: write

    steps:
      - name: "[Git] Checkout repository"
        uses: actions/checkout@v6
      - name: "[Artifact] Download"
        uses: actions/download-artifact@v8
        with:
          name: kkutu-web
          path: build/libs
      - name: "[Git] Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kkutu-web-v${{ github.run_number }}
          files: build/libs/kkutu-web-*.jar
          token: ${{ secrets.GH_TOKEN }}
      - name: "[Docker] Log in to the Container registry"
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "[Docker] Extract metadata (tags, labels) for Docker"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: "[Docker] Build and push Docker image"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
