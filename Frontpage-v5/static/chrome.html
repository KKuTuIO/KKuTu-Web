<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Explorer 지원 중단 안내</title>
    <style>
        @charset "UTF-8";
        
        @font-face {
            font-family: 'NBGothic';
            src: local('Nanum Barun Gothic'),
               local('NanumBarunGothic'),
               local('NanumBarunGothicOTF'),
               local('나눔바른고딕'),
               local('나눔바른고딕OTF'),
               url(https://cdn.kkutu.io/font/NanumBarunGothic.eot?#iefix) format('embedded-opentype'),
               url(https://cdn.kkutu.io/font/NanumBarunGothic.woff2) format('woff2'),
               url(https://cdn.kkutu.io/font/NanumBarunGothic.woff) format('woff'),
               url(https://cdn.kkutu.io/font/NanumBarunGothic.ttf) format('truetype');
        }
        
        body {
            font-family: 'NBGothic', 'Nanum Barun Gothic', '나눔바른고딕', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .browsers {
            margin-top: 20px;
        }
        .browser {
            display: inline-block;
            margin: 0 10px;
            text-align: center;
        }
        .browser img {
            width: 16px;
            height: 16px;
        }
        .browser a {
            display: block;
            margin-top: 5px;
            color: #0078d4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>최신 브라우저를 이용해주세요</h1>
        <p>
            끄투리오는 더 이상 Internet Explorer 및 구형 브라우저를 지원하지 않습니다.<br>
            보다 쾌적한 서비스 이용을 위해 최신 브라우저를 이용해주세요.<br><br>
            Chrome 브라우저 사용을 권장합니다.
        </p>
        <div class="browsers">
            <div class="browser">
                <a href="https://www.google.com/intl/ko/chrome/">
                    Chrome 다운로드
                </a>
            </div>
        </div>
    </div>
</body>
</html>
