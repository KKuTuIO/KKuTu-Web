<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="dns-prefetch" href="//cdn.kkutu.io" />
    <title>끄투리오 4.0 프롤로그</title>
    
    <link rel="icon" type="image/x-icon" href="https://cdn.kkutu.io/favicon.ico?v=3.7">
    <link rel="manifest" href="/manifest.json">

    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
    integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="https://cdn.kkutu.io/img/bi/bi_vertical_white.png" alt="Logo" style="height: 36px;">
            <div class="header-links">
                <a href="/">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Home.svg">
                </a>
                <a href="https://cafe.naver.com/kkutuio" target="_blank">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Cafe.svg">
                </a>
                <a href="/?server=0">
                    <button>
                        게임 시작
                    </button>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="back-decoration">
                <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/ContainerL.png" alt="Left Decoration" class="left-decoration">
                <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/ContainerR.png" alt="Right Decoration" class="right-decoration">
            </div>
            <div class="logo-group">
                <div class="decoration">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Upper.png" class="upper">
                </div>
                <div class="logo">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Logo_Sparkle.png" alt="Logo" class="logo-sparkle-l">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Logo_V4.png" alt="Logo" class="logo-v4">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Logo_Update.png" alt="Logo" class="logo-update">
                    <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/Logo_SparkleR.png" alt="Logo" class="logo-sparkle-r">
                </div>
            </div>
            <div class="text">
                <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/ContainerDesc.png" alt="Description" class="description">
                <div class="share">
                    <img src="https://cdn.kkutu.io/img/kkutu/kakao.png" alt="Kakao Share" class="kakao-share">
                    <a href="#">
                        <img src="https://cdn.kkutu.io/img/kkutu/copy.png" alt="Link Share" class="link-share">
                    </a>
                </div>
            </div>
        </div>
        <div class="content">
            <a href="https://cafe.naver.com/kkutuio/2458" target="_blank">
                <img src="https://cdn.kkutu.io/img/front/event/2025_0330_v4/ContentLink_2.png" alt="Probability" class="probability">
            </a>
        </div>
        <div class="disclaimer"></div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "./2025_0330_v4.css";
            document.head.appendChild(link);
        });

        if (window.innerWidth < 800) {
            alert("본 페이지는 PC 화면에 최적화되어 있습니다. 모바일에서는 정상적으로 표시되지 않을 수 있습니다.");
        }
        

        //카카오링크 init
        Kakao.init('424a33dd14697c7a6fe8fce22fa4fb14');

        document. querySelector('.kakao-share').addEventListener('click', function() {
            Kakao.Share.sendCustom({
                templateId: 118900
            });
        });

        document.querySelector('.link-share').addEventListener('click', function() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(function() {
                alert("링크가 복사되었습니다.");
            }, function(err) {
                console.error('Error copying text: ', err);
            });
        });
    </script>
</body>
</html>
