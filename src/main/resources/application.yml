server:
  port: <Port>
  servlet:
    session:
      tracking-modes: cookie
      timeout: 12h
      cookie:
        name: KKUTU-WEB-SESSION
        http-only: true
        secure: true
        same-site: lax
      persistent: true
      store-dir: <Your Session Dir>

spring:
  application:
    name: kkutu-web
  thymeleaf:
    cache: true
  messages:
    basename: locale/message
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://<Host>:<Port>/<Database>
    username: <Username>
    password: <Password>
  mail:
    host: <SMTP Host>
    port: 587
    username: <SMTP Username>
    password: <SMTP Password>
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jpa:
    open-in-view: false
  cache:
    type: simple
  redis:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 2
    host: <Host>
    port: <Port>
  cors:
    pattern: /api/admin/**
    methods: GET,POST,PUT,PATCH,DELETE
    allowed-origins: <Origin>
  security:
    user:
      name: <Username>
      password: <Password>
  boot:
    admin:
      client:
        url: <Monitoring Server>
        username: <Username>
        password: <Password>
        instance:
          service-url: <Service Url>
          metadata:
            user.name: ${spring.security.user.name}
            user.password: ${spring.security.user.password}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

resilience4j:
  ratelimiter:
    instances:
      recordFindByGameId:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      recordFindUserHistory:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      recordFindUserModeStats:
        limitForPeriod: 3
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

# Identity Provider secrets must be injected by deployment configuration; never commit real values.
idp:
  issuer: https://kkutu.io
  rp-id: kkutu.io
  allowed-origins: https://kkutu.io
  internal-api-key: ""
  data-encryption-key: ""
  mail:
    from: no-reply@kkutu.io
  recaptcha:
    site-key: ""
    secret: ""
    minimum-score: 0.5
    expected-hostnames: kkutu.io
  password:
    enabled: true
  signing-key:
    rotation-days: 90
    previous-key-grace-days: 30
  legacy-migration:
    enabled: false
