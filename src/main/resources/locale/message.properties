play.tip.1=<b>미션</b> 단어를 먼저 외우면 장문을 외우는 것보다 레벨 올리기가 편해요.
play.tip.2=체인이 높아질수록 장문보다 <b>미션</b> 단어가 더 효과적이에요.
play.tip.3=<b>미션</b> 글자가 많이 들어간 단어를 치면 장문보다 유리할 때도 있어요.
play.tip.4=장문은 최대한 길고 미션 글자가 많이 들어간 단어를 외우고, 공격단어는 짧고 확실하게 유리한 단어를 외우세요.
play.tip.5=자주 나오는 단어는 미션 단어까지 통째로 외워 두면 도움이 돼요.
play.tip.6=새로 외운 긴 단어는 바로 실전에서 써 보면 더 오래 기억에 남아요.
play.tip.7=레벨이 높은 사람들과 함께 플레이하면 장문과 공격단어에 많이 당하겠지만, 그만큼 실력이 빨리 늘어요.
play.tip.8=<b>미션</b> 모드를 켜면 왼쪽에 미션 글자가 나오고, 그 글자가 들어간 단어를 치면 추가 점수를 얻을 수 있어요.
play.tip.9=<b>친선전</b>은 전적이 남지 않고 승률에도 영향을 주지 않아요.
play.tip.10=일부 아이템을 착용하면 핑이나 경험치를 더 받을 수 있어요.
play.tip.11=<b>단어 토큰</b>은 5핑에 구매할 수 있고, 핑은 방을 만들거나 들어가서 플레이하면 얻을 수 있어요.
play.tip.12=더 많은 핑을 얻고 싶다면 상대와 라운드를 오래 이어가 보세요.
play.tip.13=경험치가 목적이라면 글자 조각을 1개씩 조합하는 게 가장 이득이에요.
play.tip.14=가격이 비싸다고 해서 효과가 더 좋은 건 아니에요.
play.tip.15=게임이 끝나고 나오는 <b>글자 조각</b>은 있는 단어로 합성해서 아이템을 얻을 수 있어요.
play.tip.16=<b>백과사전 낱장</b>은 경험치가 높을수록 개당 경험치를 더 많이 받아요.
play.tip.17=<b>오끄감</b>으로 상자를 열어 출석주화를 얻고, 그 주화로 상자를 열거나 낱장을 얻어 모레미를 꾸미거나 낱장작을 할 수 있어요.
play.tip.18=게임 중에 나가거나 정책을 위반하면 이름 옆에 <b>주의</b> 표시가 떠요.
play.tip.19=<b>어인정</b> 설정을 바꾸면 더 다양한 단어를 써 볼 수 있어요.
play.tip.20=<b>사전</b>에서 단어를 검색해 볼 수 있어요.
play.tip.21=<b>도움말</b>에서 게임 중 궁금한 점을 찾아볼 수 있어요.
