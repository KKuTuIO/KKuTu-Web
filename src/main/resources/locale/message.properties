play.cmd.help.e=(/귓, /e [대상] [내용]) 대상에게 귓속말을 보냅니다.
play.cmd.help.ee=(/답, /ee [내용]) 가장 최근에 귓속말을 보낸 상대에게 귓속말을 보냅니다.
play.cmd.help.wb=(/wb [대상]) 대상의 귓속말을 무시합니다. 무시된 상태에서 이 명령어를 다시 사용하면 무시가 해제됩니다.
play.cmd.help.shut=(/shut [대상]) 대상의 모든 대화를 차단합니다. 차단된 상태에서 이 명령어를 다시 사용하면 차단이 해제됩니다.
play.cmd.help.qw=(/ㅂㅈ, /qw [방 제목]) 방 제목을 바꿉니다.
play.cmd.help.tr=(/ㅅㄱ, /tr [시간(초)]) 라운드 시간을 바꿉니다.
play.cmd.help.dd=(/ㅇㅇ, /dd [인원(명)]) 최대 플레이어 수를 바꿉니다.
play.cmd.help.fde=(/ㄹㅇㄷ, /fde [라운드]) 라운드 수를 바꿉니다.
play.cmd.help.qq=(/ㅂㅂ, /qq [비밀번호]) 방 비밀번호를 바꿉니다.
play.cmd.help.dg=(/ㅇㅎ, /dg [유형]) 게임 유형을 바꿉니다.
play.cmd.help.ww=(/ㅈㅈ, /ww) 단어 주제를 바꿉니다.
