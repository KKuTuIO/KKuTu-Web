play.story.lobby.hi=끄투리오에 어서와레미! 나는 <b>학사모레미</b>야레미. 먼저 로비를 같이 둘러볼까레미?
play.story.lobby.rooms=여기가 <b>방 목록</b>이야레미. 다른 사람들이 만든 방이 이렇게 모여 있어레미. 마음에 드는 방을 눌러 들어가면 돼레미.
play.story.lobby.quick=방을 고르기 귀찮다면 <b>매칭 시작</b>을 눌러레미. 알맞은 방으로 바로 데려다 줄게레미.
play.story.lobby.create=<b>방 만들기</b>로 내가 방장이 되어 규칙을 정할 수도 있어레미. 자세한 건 3번 수업에서 알려줄게레미.
play.story.lobby.chat=여기는 <b>로비 채팅</b>이야레미. 인사도 하고, 같이 할 사람도 구해 봐레미.
play.story.lobby.side=왼쪽에서는 <b>친구</b>와 <b>접속자</b>를 볼 수 있어레미. 친구를 추가해 두면 언제 접속했는지 바로 알 수 있어레미.
play.story.lobby.profile=여기는 내 <b>프로필</b>이야레미. 레벨과 경험치를 볼 수 있어레미. 게임을 할수록 경험치가 쌓여레미!
play.story.lobby.nav=위쪽 메뉴에서는 <b>랭킹</b>, <b>상점</b>, <b>사전</b> 같은 곳으로 갈 수 있어레미. 모르는 낱말은 사전에서 찾아봐레미.
play.story.lobby.help=궁금한 게 생기면 언제든 <b>도움말</b> 버튼으로 나를 불러줘레미!
play.story.lobby.chat.phone=오른쪽 아래의 <b>채팅 버튼</b>을 누르면 <b>로비 채팅</b>이 열려레미. 인사도 하고, 같이 할 사람도 구해 봐레미.
play.story.lobby.side.phone=아래 <b>소셜</b> 탭에서는 <b>친구</b>와 <b>접속자</b>를 볼 수 있어레미. 맨 아래에는 내 <b>프로필</b>도 있어서 레벨과 경험치를 볼 수 있어레미!
play.story.lobby.nav.phone=아래 <b>탭</b>에서 <b>상점</b>이나 <b>소셜</b>로 갈 수 있고, <b>더보기</b>에는 <b>랭킹</b>과 <b>사전</b>이 있어레미. 모르는 낱말은 사전에서 찾아봐레미.
play.story.lobby.help.phone=궁금한 게 생기면 아래 <b>도움말</b>(또는 <b>더보기</b>)에서 언제든 나를 불러줘레미!
play.story.lobby.start=<b>게임 시작!</b> 버튼이야레미. 이걸 누르면 놀고 싶은 방식을 고를 수 있어레미. 같이 눌러 보자레미!
play.story.lobby.multi=여기는 <b>멀티플레이</b>야레미. 다른 사람들과 함께 노는 곳이야레미.
play.story.lobby.rooms2=<b>방 목록</b>을 누르면 다른 사람들이 만든 방이 모여 있어레미. 마음에 드는 방을 눌러 들어가면 돼레미.
play.story.lobby.single=<b>싱글플레이</b>는 혼자서 즐기는 곳이야레미. <b>아케이드</b>에서 혼자 할 수 있는 게임을 골라 봐레미.
play.story.lobby.tutorial=<b>튜토리얼</b>은 지금 하고 있는 이 수업이야레미. 또 궁금해지면 언제든 눌러서 나를 불러줘레미!
play.story.chain.how.phone=내 차례가 오면 맨 아래 <b>채팅 줄</b>에 낱말을 쓰고 키보드의 <b>보내기</b>를 눌러레미. 어떤 낱말을 쓸지는 내가 알려줄게레미!
play.story.room.options.phone=고른 유형에 따라 쓸 수 있는 <b>규칙</b>이 달라져레미. 규칙을 눌러서 켜고 끌 수 있어레미.
play.story.lobby.bye=이제 로비는 문제없겠지레미? 다음에는 직접 끝말잇기를 해 보자레미!
play.story.chain.hi=이번에는 나랑 <b>끝말잇기</b>를 해 볼 거야레미. 연습이니까 편하게 해레미!
play.story.chain.rule=규칙은 간단해레미. 앞 사람이 낸 낱말의 <b>마지막 글자</b>로 시작하는 낱말을 이어 가면 돼레미.
play.story.chain.how=내 차례가 오면 <b>입력창</b>에 낱말을 쓰고 <b>Enter</b>를 눌러레미. 어떤 낱말을 쓸지는 내가 알려줄게레미!
play.story.chain.bye=정말 잘했어레미! 이제 진짜 방에서도 낱말을 이어 갈 수 있겠지레미? 로비로 돌아가서 매칭을 눌러 봐레미!
play.story.chain.guide=나는 '{word}'(이)라고 냈어레미! 이제 '<b>{char}</b>'(으)로 시작하는 낱말을 이어 줘레미.
play.story.chain.good=좋아레미! '{word}', 멋진 낱말이야레미.
play.story.chain.err.start='<b>{char}</b>'(으)로 시작하는 낱말을 써야 해레미! '<b>{word}</b>'(이)라고 써 봐레미.
play.story.room.hi=이번에는 <b>방 만드는 법</b>을 알려줄게레미. 방 만들기 창을 열어 볼게레미!
play.story.room.mode=먼저 <b>게임 유형</b>을 골라레미. 끝말잇기, 앞말잇기, 타자 대결처럼 여러 가지가 있어레미.
play.story.room.options=고른 유형에 따라 쓸 수 있는 <b>규칙</b>이 달라져레미. 마우스를 올리면 설명이 나와레미.
play.story.room.title=<b>방 제목</b>은 다른 사람들이 방 목록에서 보는 이름이야레미. 비워 두면 알아서 정해 줘레미.
play.story.room.password=<b>비밀번호</b>를 걸면 비밀번호를 아는 친구만 들어올 수 있어레미.
play.story.room.limit=<b>최대 인원</b>은 방에 들어올 수 있는 사람의 수야레미.
play.story.room.round=<b>라운드</b> 수는 총 몇 번 게임을 할지 정하는 거야레미.
play.story.room.time=<b>제한 시간</b>은 한 번에 낱말을 생각할 수 있는 시간이야레미.
play.story.room.submit=다 정했다면 여기를 눌러 방을 만들어레미. 오늘은 연습이니까 누르지 않을게레미!
play.story.room.bye=이제 나만의 방도 만들 수 있겠지레미? 수고했어레미!
play.tutorial.title=학사모레미의 튜토리얼
play.tutorial.subtitle=나와 함께 끄투 고수가 되어 보지 않을래?<br>튜토리얼을 완수하면 100(P)를 줄게!
