play.story.chain.r3.why=방 설정에서 <b>어인정</b>을 켜면 사전에 없는 다양한 단어를 쓸 수 있어레미.
play.story.chain.r3.on=그러면 내가 <b>어인정</b>을 켤테니 다시 입력해 보자레미!
play.story.chain.r3.again=어인정을 켰으니 이번엔 될 거야레미! '<b>{word}</b>'를 다시 써 봐레미.
play.story.chain.r3.ok=성공이야레미! 어인정을 켜니까 '<b>{word}</b>'도 쓸 수 있어레미!
play.story.chain.r3.out=이번에도 시간이 다 됐어레미! 이제 결과를 보러 가자레미!
play.tutorial.chain.mean.english=[1]=감옥02(監獄)「1」. [2] 언어 인도ㆍ유럽 어족 게르만 어파의 서게르만 어군에 속한 언어. 미국, 영국, 캐나다, 오스트레일리아 등을 비롯하여 세계 여러 나라에서 사용하는 국제어의 구실을 하고 있다. ≒영14(英)「1」. [3]=영성04(鈴聲). [4] 인명 ‘김병국’의 호. [5] 어업을 경영함.
play.tutorial.chain.mean.child=[1] ‘어린아이’를 대접하거나 격식을 갖추어 이르는 말. 대개 4, 5세부터 초등학생까지의 아이를 이른다. [2] 문학 1923년부터 1934년까지 소파 방정환의 주재로 간행된 아동 잡지. 민족혼을 일깨우고, 아동 문학가를 발굴하고 육성하는 데 기여하였다.
play.tutorial.chain.mean.iridium=[1] 화학 백금족에 속하는 은백색의 금속 원소. 산과 알칼리에 녹지 않으며, 백금과의 합금으로 화학 기구를 만드는 데 쓴다. 원자 기호는 Ir, 원자 번호는 77, 원자량은 192.22. [2] 마인크래프트
play.tutorial.chain.mean.lemon=<식물> 운향과의 상록 소교목. 높이는 3미터 정도이며, 잎은 어긋나고 달걀 모양인데 끝이 뾰족하다. 5~10월에 향기가 나는 흰 꽃이 피고 열매는 타원형으로 노랗게 익는데 향기가 진하다. 과즙에 시트르산이 많이 들어 있어 신맛이 있으며 향료로 널리 쓴다. 인도가 원산지로 아열대 각지에서 재배한다. ≒영몽01(檸檬). (Citrus limon)
play.tutorial.chain.mean.monster=<영화>
play.story.chain.pause=실제 게임에서는 일시정지가 안 되지만 너를 위해 특별히 일시정지해줬어레미. 천천히 입력해봐레미!
